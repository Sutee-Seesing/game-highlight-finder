schema_version: 1

storage:
  data_dir: data

tools:
  # Null means resolve the executable from PATH.
  ffmpeg_path: null
  ffprobe_path: null
  probe_timeout_seconds: 120
  ffmpeg_timeout_seconds: 7200
  termination_grace_seconds: 5

logging:
  level: INFO

media:
  proxy:
    max_height: 480
    max_width: 854
    video_bitrate_kbps: 600
    audio_bitrate_kbps: 64
    fps: 30
    video_codec: libx264
    audio_codec: aac
    preset: veryfast
  audio:
    sample_rate_hz: 16000
    channels: 1
    bitrate_kbps: 64
    codec: aac

disk:
  safety_factor: 1.5
  minimum_free_bytes: 0

signals:
  silence:
    noise_db: -35
    min_duration_seconds: 0.25
  loudness:
    interval_ms: 500

scout:
  # Fake is the safe default. Gemini requires explicit remote-upload opt-in.
  backend: fake
  fixture_path: null
  response_max_bytes: 1048576
  schema_version: 1
  canonicalization_version: m3-canonical-v1
  model: gemini-3.5-flash-lite
  billing_mode: standard
  allow_remote_upload: false
  api_key_env: GEMINI_API_KEY
  media_resolution: low
  max_duration_seconds: 900
  max_output_tokens: 2048
  max_thinking_tokens: 1024
  prompt_version: gemini-scout-v1
  readiness_timeout_seconds: 120
  readiness_poll_initial_seconds: 1
  readiness_poll_max_seconds: 8
  cleanup_retry_limit: 3

cost:
  # Production Gemini quotes still require an explicit FX snapshot.
  monthly_budget_thb: "100.00"
  budget_timezone: Asia/Bangkok
  hard_limit: true
  estimate_safety_factor: "1.20"
  pricing_max_age_days: 30
  fx_max_age_days: 30
  ledger_path: null
  pricing_catalog_path: null
  fx_snapshot_path: null
