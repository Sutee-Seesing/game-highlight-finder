schema_version: 1

storage:
  data_dir: data

tools:
  # Null means resolve the executable from PATH.
  ffmpeg_path: null
  ffprobe_path: null
  probe_timeout_seconds: 120
  ffmpeg_timeout_seconds: 7200
  termination_grace_seconds: 5

logging:
  level: INFO

media:
  proxy:
    max_height: 480
    max_width: 854
    video_bitrate_kbps: 600
    audio_bitrate_kbps: 64
    fps: 30
    video_codec: libx264
    audio_codec: aac
    preset: veryfast
  audio:
    sample_rate_hz: 16000
    channels: 1
    bitrate_kbps: 64
    codec: aac

disk:
  safety_factor: 1.5
  minimum_free_bytes: 0

signals:
  silence:
    noise_db: -35
    min_duration_seconds: 0.25
  loudness:
    interval_ms: 500

scout:
  # M3 remains offline and deterministic. Real providers are future M5 work.
  backend: fake
  fixture_path: null
  response_max_bytes: 1048576
  schema_version: 1
  canonicalization_version: m3-canonical-v1

cost:
  # M4 is provider-neutral and does not ship production prices.
  monthly_budget_thb: "100.00"
  budget_timezone: Asia/Bangkok
  hard_limit: true
  estimate_safety_factor: "1.20"
  pricing_max_age_days: 30
  fx_max_age_days: 30
  ledger_path: null
  pricing_catalog_path: null
  fx_snapshot_path: null
