[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "game-highlight-finder"
version = "0.3.0"
description = "Local-first gameplay analysis with deterministic and opt-in Gemini Scout backends"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sutee Seesing" }]
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
gemini = [
  "google-genai>=2.3,<3",
]

[project.scripts]
highlight = "game_highlight_finder.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/game_highlight_finder"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "integration: tests that invoke local media binaries",
  "live_gemini: explicitly opt-in tests that may call the Gemini API",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
